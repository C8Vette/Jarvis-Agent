device_name: Ethan Desktop
allowed_folders:
- C:/Users/tsmgr/Desktop
- C:/Users/tsmgr/Documents
- C:/Users/tsmgr/Downloads
apps:
  chrome: C:/Program Files/Google/Chrome/Application/chrome.exe
  edge: C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe
  opera: C:/Users/tsmgr/AppData/Local/Programs/Opera/opera.exe
