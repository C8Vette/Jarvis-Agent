      speak_responses: true
      continuous_session: false
      wake_word_required: true
      session_idle_timeout_seconds: 18.0
      session_max_turns: 1
  realtime:
    enabled: false
    provider: openai
    model: gpt-4o-realtime-preview
    session_timeout_seconds: 600
    idle_timeout_seconds: 45
    requires_backend_proxy: true
integrations:
  gmail:
    enabled: false
    credentials_path: data/google/credentials.json
    token_path: data/google/token.json
    max_messages: 8
    query: newer_than:7d -category:promotions
    important_query: is:unread newer_than:7d
